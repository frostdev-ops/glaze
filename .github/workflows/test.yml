name: test
on:
  push:
    tags-ignore: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A test that hangs instead of failing would otherwise hold the runner for GitHub's six-hour limit.
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA, with the tag each was resolved from in its comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 22's deflate-raw stream accepts trailing junk; 26 follows the browser contract.
          node-version: 26
      - run: node --test
  browser:
    permissions:
      contents: read
    uses: ./.github/workflows/browser.yml
