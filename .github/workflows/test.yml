name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22's deflate-raw stream accepts trailing junk; 26 follows the browser contract.
          node-version: 26
      - run: node --test
