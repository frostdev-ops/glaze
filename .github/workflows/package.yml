name: Package

on:
  push:
    tags: ['v*']

# No job inherits a token that can write. The package job reads the repository; only the release job below can write,
# and it checks nothing out and runs no repository code. Actions are pinned by commit SHA (the tag each was resolved
# from is in its comment): a moved tag cannot change what runs. To update one, resolve the new tag and replace both.
permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # A tag that names another version would attach a zip of the manifest's version to the wrong release.
      - name: Check the tag names the manifest's version
        run: test "v$(node -p 'require("./manifest.json").version')" = "${GITHUB_REF_NAME%%-rc*}"

      - name: Validate the tagged source
        run: node --test

      - name: Build the Chrome zip
        run: ./package.sh

      - name: Hand the zip to the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-zip
          path: dist

      - name: Attach it to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.zip
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
