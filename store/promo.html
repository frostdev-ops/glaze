<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glaze store artwork</title>
<!-- Rendered by tools/release/store-screenshots.js. Product imagery is a capture of the real
     settings page with invented course data. Store artwork contains no pricing or status claims. -->
<style>
  @font-face { font-family: "Glaze Inter"; src: url("../extension/fonts/inter.woff2") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: "Glaze Inter", system-ui, sans-serif; color: #edf8ff; background: #07121e; }
  .light { position: fixed; inset: 0; background:
    radial-gradient(ellipse at 72% 15%, #28c8ed38, transparent 55%),
    radial-gradient(ellipse at 85% 95%, #35ddac20, transparent 55%),
    radial-gradient(ellipse at 10% 70%, #4b68b51a, transparent 65%); }
  main { position: relative; height: 100%; }
  .copy { position: absolute; z-index: 1; left: 76px; top: 170px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 88px; height: 88px; }
  h1 { margin: 0; font-size: 88px; font-weight: 740; letter-spacing: -.055em; line-height: 1; }
  p { margin: 30px 0 0 4px; color: #a9c7d8; font-size: 21px; font-weight: 450; line-height: 1.65; }
  .product { position: absolute; width: 850px; top: 64px; left: 568px; transform: rotate(-3deg);
    border: 1px solid #67c4e14a; border-radius: 17px; overflow: hidden; background: #0b1929;
    box-shadow: 0 32px 90px #0008, 0 0 90px #1ac7ee0c; }
  .product img { display: block; width: 100%; height: auto; }
  .tile .copy { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .tile .brand { gap: 16px; }
  .tile .brand img { width: 68px; height: 68px; }
  .tile h1 { font-size: 66px; }
  .tile p { margin: 25px 0 0; font-size: 17px; line-height: 1; color: #bad6e4; }
  .tile p br { display: none; }
  .tile .product { display: none; }
</style>
</head>
<body>
  <div class="light"></div>
  <main>
    <div class="copy">
      <div class="brand"><img src="../extension/icons/icon.svg" alt=""><h1>Glaze</h1></div>
      <p>Canvas · Blackboard · Moodle</p>
    </div>
    <div class="product"><img src="./art/screenshots/1-settings-look.jpg" alt="Glaze theme settings and course preview"></div>
  </main>
<script>
  document.body.className = new URLSearchParams(location.search).get('size') === 'tile' ? 'tile' : 'marquee';
  Promise.all([document.fonts.ready, ...Array.from(document.images, image => image.decode())])
    .then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
