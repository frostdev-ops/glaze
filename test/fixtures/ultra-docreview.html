<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Submission review</title>
<style>
* { box-sizing: border-box; } html,body { margin:0; height:100%; font:14px/1.5 sans-serif; }
student-view-submission,student-view-submission-panel { display:flex; height:100%; flex-direction:column; }
.review-shell { position:absolute; inset:0; display:flex; flex-direction:column; }
.review-title { height:48px; min-height:48px; display:flex; align-items:center; justify-content:center; }
.review-title h1 { font-size:16px; margin:0; } .review-title button { position:absolute; left:0; top:0; height:44px; width:44px; }
.review-scroll,.review-body { min-height:0; flex:1; display:flex; flex-direction:column; overflow:auto; }
.review-grade { flex:none; height:75px; display:flex; align-items:center; justify-content:space-between; padding:12px; }
main { display:flex; flex:1; min-height:0; overflow:hidden; } section { display:flex; flex-direction:column; flex:1; min-width:0; overflow:auto; }
.review-feedback { height:124px; flex:none; padding:16px 12px; } .feedback-text { padding:16px; border:1px solid #888; border-radius:20px; }
.review-files,.review-chain { flex:1; min-height:0; display:flex; flex-direction:column; overflow:auto; }
[role=tablist] { display:flex; height:48px; min-height:48px; align-items:center; position:relative; }
[role=tab] { height:48px; border:0; background:transparent; padding:12px; } [role=tabpanel] { flex:1; min-height:0; border-block:1px solid #888; }
[role=tabpanel] iframe { display:block; width:100%; height:100%; border:0; }
aside { width:430px; flex:none; overflow:auto; padding:16px; background:#f0f0f0; } .rubric-inline-container { height:1000px; }
</style></head><body>
<student-view-submission class="react-container"><student-view-submission-panel><div class="review-shell">
<header class="review-title"><button type="button" aria-label="Close">×</button><h1>Module 3: Business Letter</h1></header>
<div class="review-scroll"><div class="review-body">
<div class="review-grade"><div>Final Grade <span>5 / 5 · 100%</span></div><div>SUBMITTED 9/26/26, 11:00 PM <a href="#receipt">Receipt</a> <span>5 / 5</span></div></div>
<main><section><div class="review-feedback"><div class="js-overall-feedback">Overall Feedback</div><div class="feedback-text"><p>You included all the required components and submitted the assignment on time. Nice work!</p><p>A second line of detailed feedback remains available.</p></div></div>
<div class="review-files"><div role="tablist" aria-label="Submission files"><button type="button" role="tab">Instructions</button><button type="button" role="tab" aria-selected="true">Business Letter.docx</button></div><div class="review-chain"><div id="files-viewer-tab-panel-:r1:" role="tabpanel"><iframe title="Document viewer" src="https://annotate-us.foundations.blackboard.com/ui/pdf-viewer/1/index.html"></iframe></div></div></div>
</section><aside><h2>Rubric</h2><div class="rubric-inline-container"><p>Rubric grade: 5 / 5</p><button type="button">Margin settings</button><p>Proficient</p></div></aside></main>
</div></div></div></student-view-submission-panel></student-view-submission>
</body></html>
