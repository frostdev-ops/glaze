<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title translate="no">Glaze</title>
<link rel="stylesheet" href="../../ui.css">

<body>
<!-- The oldest waiting ask (lib/mcp/approve-page.js fills it from storage.session). -->
<main id="ask" hidden>
  <h1 id="title"></h1>
  <p id="group" hidden></p>
  <p class="who"><b id="app" translate="no"></b><span class="hint">as the app reports itself</span><span id="exe" class="hint" translate="no" hidden></span></p>
  <p id="state" role="status" hidden></p>
  <div class="row" id="buttons"><button id="no" type="button" autofocus>Don't allow</button><button id="yes" type="button" class="primary">Allow</button></div>
</main>
<script src="../color.js"></script>
<script src="../fonts.js"></script>
<script src="../surfaces.js"></script>
<script src="../../defaults.js"></script>
<script src="../../i18n/de.js"></script>

<script src="../../i18n/nl.js"></script>

<script src="approve-page.js"></script>
</body>
</html>
